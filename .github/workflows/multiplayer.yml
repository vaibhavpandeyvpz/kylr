name: Publish to Edgegap

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified server image to Edgegap
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: multiplayer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    # MongoDB 8.0 rejects the newer kernels on Ubuntu 24.04 runners.
    # https://github.com/actions/runner-images/issues/15005
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r game/services/requirements-dev.txt
      - name: API and publication tests
        working-directory: game
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017
        run: python -m pytest services/tests ../tools/tests/test_online_configuration.py ../tools/tests/test_edgegap_publication.py -q

  server:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore licensed assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_ASSET_URI: ${{ vars.R2_ASSET_URI }}
          PRIVATE_GAME_ASSETS_SHA256: ${{ secrets.PRIVATE_GAME_ASSETS_SHA256 }}
        run: python tools/install_private_assets.py --download
      - uses: docker/setup-buildx-action@v3
      - name: Select private registry
        if: inputs.publish
        env:
          EDGEGAP_IMAGE: ${{ vars.EDGEGAP_IMAGE }}
        run: '[[ "$EDGEGAP_IMAGE" == registry.edgegap.com/* ]]'
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: registry.edgegap.com
          username: ${{ secrets.EDGEGAP_REGISTRY_USERNAME }}
          password: ${{ secrets.EDGEGAP_REGISTRY_TOKEN }}
      - name: Build server and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: game/services/deploy/Dockerfile.edgegap
          platforms: linux/amd64
          tags: ${{ inputs.publish && vars.EDGEGAP_IMAGE || 'kylr-server' }}:${{ github.sha }}
          push: ${{ inputs.publish }}
          cache-from: type=gha,scope=dedicated-server
          cache-to: type=gha,scope=dedicated-server,mode=max
      - name: Register Edgegap version
        if: inputs.publish
        env:
          EDGEGAP_API_KEY: ${{ secrets.EDGEGAP_API_KEY }}
          EDGEGAP_APPLICATION: ${{ vars.EDGEGAP_APPLICATION }}
          EDGEGAP_IMAGE: ${{ vars.EDGEGAP_IMAGE }}
          EDGEGAP_REGISTRY_USERNAME: ${{ secrets.EDGEGAP_REGISTRY_USERNAME }}
          EDGEGAP_REGISTRY_TOKEN: ${{ secrets.EDGEGAP_REGISTRY_TOKEN }}
        run: |
          python -m pip install requests==2.34.2
          python tools/publish_edgegap_version.py
